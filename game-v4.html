<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142d31">
  <title>Tower Offense — Crystal Meadow Browser Demo</title>
  <style>
    html,body,#canvas{margin:0;padding:0;border:0;width:100%;height:100%;overflow:hidden;background:#142d31}
    #canvas{display:block;touch-action:none;outline:none}
    #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#142d31;color:#f2dfb0;font:15px system-ui,sans-serif;z-index:2}
    #status[hidden]{display:none}.card{max-width:560px;width:100%;text-align:center}h1{font-size:clamp(18px,4vw,30px);margin:8px 0 16px}.eyebrow{letter-spacing:.16em;font-size:12px;color:#edbc65}
    progress{width:min(100%,360px);height:12px;accent-color:#edbc65}#message{line-height:1.6;color:#a5bab0}button,a{display:inline-block;background:#edbc65;color:#142d31;border:0;border-radius:7px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none}
    button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}details{text-align:left;margin:16px 0}pre{max-height:180px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#retry[hidden],#technical[hidden]{display:none}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Tower Offense game"></canvas>
  <section id="status" role="status" aria-live="polite"><div class="card">
    <div class="eyebrow">TOWER OFFENSE</div><h1 id="heading">Preparing the battlefield</h1>
    <progress id="progress" aria-label="Loading game"></progress>
    <p id="message">Loading the game. The first visit may take a moment.</p>
    <details id="technical" hidden><summary>Technical details</summary><pre id="diagnostics"></pre></details>
    <button id="retry" type="button" hidden>Reload game</button>
  </div></section>
  <script src="game-v4.js"></script>
  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"game-v4","experimentalVK":false,"fileSizes":{"game-v4.pck":32354360,"game-v4.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const GODOT_THREADS_ENABLED = false;
    const overlay=document.getElementById('status'), progress=document.getElementById('progress'), message=document.getElementById('message');
    const diagnostics=document.getElementById('diagnostics'), technical=document.getElementById('technical');
    let ready=false, failed=false, startupTimer;
    function fail(detail){
      failed=true;clearTimeout(startupTimer);overlay.hidden=false;progress.hidden=true;
      document.getElementById('heading').textContent='The game could not start';
      message.textContent='Reload to try again. If this continues, share the technical details below.';
      diagnostics.textContent+=(diagnostics.textContent?'\n':'')+String(detail);technical.hidden=false;document.getElementById('retry').hidden=false;
    }
    document.getElementById('retry').addEventListener('click',()=>location.reload());
    document.getElementById('canvas').addEventListener('webglcontextlost',()=>fail('The browser lost its graphics context.'));
    window.addEventListener('error',event=>fail(event.message||'A browser resource failed to load.'));
    window.addEventListener('unhandledrejection',event=>fail(event.reason?.message||String(event.reason)));
    function onPrint(...parts){
      console.log(...parts);
      if(parts.join(' ').includes('TOWER_OFFENSE_READY')&&!failed){
        ready=true;clearTimeout(startupTimer);overlay.hidden=true;document.getElementById('canvas').focus();
      }
    }
    function onPrintError(...parts){
      console.error(...parts);
      if(!ready&&/SCRIPT ERROR|^ERROR:|Parse Error|Failed to load/i.test(parts.join(' ')))fail(parts.join(' '));
    }
    const missing=Engine.getMissingFeatures({threads:false});
    if(missing.length){fail('Required browser features: '+missing.join(', '));}
    else{
      const engine=new Engine(GODOT_CONFIG);
      engine.startGame({onPrint,onPrintError,onProgress(current,total){
        if(total>0){progress.max=total;progress.value=current;}
        if(current===total&&total>0)message.textContent='Starting the battlefield…';
      }}).then(()=>{
        if(!ready&&!failed)startupTimer=setTimeout(()=>fail('The game engine loaded, but the battlefield did not finish starting.'),30000);
      }).catch(error=>fail(error?.message||String(error)));
    }
  </script>
</body>
</html>
